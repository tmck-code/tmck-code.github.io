[project]
name = "babytracker"
version = "0.1.0"
description = "Local web UI for tracking a newborn's feeds, sleeps, nappies and weight"
readme = "README.md"
requires-python = ">=3.12"

# Third-party by necessity: stdlib has no ASGI server/framework and no DuckDB driver.
dependencies = [
    "duckdb>=1.3",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx2",
    "mypy",
    "pytest",
    "pytest-xdist",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.mypy]
exclude = [".venv/"]
plugins                  = ["pydantic.mypy"]
disallow_untyped_defs    = true
warn_return_any          = true
ignore_missing_imports   = true
strict                   = true
warn_unused_configs      = true
disallow_subclassing_any = true

[tool.ruff]
exclude = [".git", ".ruff_cache", ".venv"]
line-length    = 140
indent-width   = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "Q"]
ignore = ["E401", "E701"]

[tool.ruff.format]
quote-style  = "preserve"
indent-style = "space"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "single"
inline-quotes    = "single"
multiline-quotes = "single"
