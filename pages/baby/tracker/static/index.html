<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#171512">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Baby log">
  <title>Baby log</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/sheet.css">
  <link rel="stylesheet" href="css/trends.css">
  <link rel="stylesheet" href="css/zoom.css">
  <link rel="stylesheet" href="css/stopwatch.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/reminders.css">
  <script>
    // Theme before first paint: a saved choice wins, then the OS setting, then dark.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'dark' && theme !== 'light') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = theme === 'dark' ? '#171512' : '#F6EFE3';
    })();
  </script>
</head>
<body>
  <!-- Lucide icons (ISC licence) plus a few drawn for this app, drawn with a 2px stroke. -->
  <svg aria-hidden="true" style="position:absolute;width:0;height:0">
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-milk" viewBox="0 0 24 24"><path d="M9 3h6v3l1.5 2v11a2 2 0 0 1-2 2h-5a2 2 0 0 1-2-2V8L9 6zM7.5 12h9"/></symbol>
    <symbol id="i-droplet" viewBox="0 0 24 24"><path d="M12 3c3 3.6 5.5 6.6 5.5 10a5.5 5.5 0 0 1-11 0C6.5 9.6 9 6.6 12 3z"/></symbol>
    <symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" style="fill:currentColor"/></symbol>
    <symbol id="i-both" viewBox="0 0 24 24"><path d="M8 17a5 5 0 0 0 5-5c0-1.4-.7-2.8-2.1-3.9S8.4 5.3 8 3.5c-.4 1.8-1.4 3.5-2.9 4.6C3.7 9.2 3 10.6 3 12a5 5 0 0 0 5 5z"/><circle cx="17.5" cy="17" r="3.5" style="fill:currentColor"/></symbol>
    <symbol id="i-nappy" viewBox="0 0 24 24"><path d="M3 7h18v2c0 5-4 9-9 9s-9-4-9-9zM3 10c3 0 5 2 5 5M21 10c-3 0-5 2-5 5"/></symbol>
    <symbol id="i-weight" viewBox="0 0 24 24"><path d="M6 9h12l2 11H4zM9 9a3 3 0 0 1 6 0"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-11M3 20h18"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18zM12 7v5l3 2"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3" style="fill:currentColor"/></symbol>
    <symbol id="i-express" viewBox="0 0 24 24"><path d="M12 3c1.8 2.2 3 3.8 3 5.5a3 3 0 0 1-6 0C9 6.8 10.2 5.2 12 3zM5 14v3a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-3"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" style="fill:currentColor"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i-select" viewBox="0 0 24 24"><path d="M8 4H4v16h4"/><path d="M16 4h4v16h-4"/><path d="M10 12h4"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/><path d="M9 21H3v-6"/></symbol>
    <symbol id="i-shrink" viewBox="0 0 24 24"><path d="m14 10 7-7"/><path d="M20 10h-6V4"/><path d="m3 21 7-7"/><path d="M4 14h6v6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6a3 3 0 0 0 0 6zM19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></symbol>
    <!-- Reminders: the tick, and the icons a reminder can be given (with droplet, sun, moon and clock above). -->
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l5 5L19 7"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></symbol>
    <symbol id="i-bath" viewBox="0 0 24 24"><path d="M3 12h18v3a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4zM6 12V6a2 2 0 0 1 4 0M6 19v2M18 19v2"/></symbol>
    <symbol id="i-pill" viewBox="0 0 24 24"><path d="M10 4a4.2 4.2 0 0 1 6 6l-6 6a4.2 4.2 0 0 1-6-6zM7 7l6 6"/></symbol>
    <symbol id="i-thermometer" viewBox="0 0 24 24"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></symbol>
    <symbol id="i-scissors" viewBox="0 0 24 24"><path d="M6 9a3 3 0 1 0 0-6a3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6a3 3 0 0 0 0 6zM20 4L8.5 15.5M20 20L8.5 8.5"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><path d="M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></symbol>
    <!-- Navigation and disclosure. -->
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM8 21h8M12 17v4"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
  </svg>

  <header class="top">
    <div class="wrap top-row">
      <div class="brand"><img class="brand-mark" src="img/icon-192.png" width="44" height="44" alt="Baby log"><span class="brand-name" aria-hidden="true">Baby log</span></div>
      <!-- Today and Over time: a tab bar along the bottom on phones, a segment in the header on wider screens. -->
      <nav class="seg nav-view" aria-label="Views">
        <button type="button" class="seg-opt" data-view="today" aria-pressed="true" aria-label="Today" title="Today"><svg class="ico" width="24" height="24" aria-hidden="true"><use href="#i-home"/></svg><span class="nav-badge" id="reminders-badge" aria-hidden="true" hidden></span></button>
        <button type="button" class="seg-opt" data-view="trends" aria-pressed="false" aria-label="Over time" title="Over time"><svg class="ico" width="24" height="24" aria-hidden="true"><use href="#i-chart"/></svg></button>
      </nav>
      <!-- The shown view's title: the day on Today, the range on Over time (app.js writes both lines). -->
      <div class="head-text">
        <h1 id="day-title">Today</h1>
        <div class="day-sub muted" id="day-sub"></div>
      </div>
      <div class="daybar" id="daybar">
        <button type="button" class="btn btn-icon day-step" id="day-prev" aria-label="Previous day" title="Previous day"><svg class="ico" width="24" height="24" aria-hidden="true"><use href="#i-left"/></svg></button>
        <button type="button" class="btn btn-icon day-step" id="day-next" aria-label="Next day" title="Next day" disabled><svg class="ico" width="24" height="24" aria-hidden="true"><use href="#i-right"/></svg></button>
        <button type="button" class="btn btn-primary back-today" id="day-today" hidden>Back to today</button>
      </div>
      <button type="button" class="btn btn-icon nav-gear" data-view="settings" aria-pressed="false" aria-label="Settings" title="Settings"><svg class="ico" width="24" height="24" aria-hidden="true"><use href="#i-settings"/></svg></button>
    </div>
  </header>

  <main class="wrap">
    <div id="view-today">
      <!-- Phones: one column in the order below (style.css sets it). 900px: two columns with the log
           under them. 1080px: three columns that fit the window. -->
      <div class="cols">
        <div class="col col-a">
          <div id="running" class="running" hidden></div>
          <!-- Time since the last feed and nappy, and awake or asleep for (app.js). Today only. -->
          <section id="since" class="since" aria-label="Time since last" hidden></section>
          <div id="quick" class="quick" hidden></div>
          <!-- Reminders that are due, coming up or just done (reminders.js). Hidden when there are none. -->
          <section id="reminders" class="reminders" aria-labelledby="reminders-title" hidden></section>
          <section class="panel totals-card" aria-labelledby="totals-title">
            <h2 id="totals-title">Totals</h2>
            <div id="totals" class="totals"></div>
          </section>
        </div>
        <div class="col col-b">
          <section class="panel intake" id="recent-section" aria-labelledby="recent-title" hidden>
            <div class="recent-head">
              <h2><span id="recent-title">Intake</span> <span class="h2-unit" id="recent-unit"></span></h2>
              <!-- Today only: how far back the chart looks (app.js shows it and remembers the choice). -->
              <div class="seg recent-window" id="recent-window" role="group" aria-label="Chart window" hidden>
                <button type="button" class="seg-opt" data-window="24h" aria-pressed="true" title="From now back 24 hours">Last 24 h</button>
                <button type="button" class="seg-opt" data-window="midnight" aria-pressed="false" title="From now back to midnight: today so far">Today</button>
              </div>
            </div>
            <div class="recent-figure">
              <span class="recent-total" id="recent-total"></span>
              <span class="recent-target" id="recent-target"></span>
            </div>
            <div id="recent" class="recent" data-ev="feed"></div>
          </section>
          <section class="panel glance">
            <div class="glance-head">
              <h2>Day at a glance</h2>
              <div id="strip-zoom" class="glance-zoom"></div>
            </div>
            <div id="strip"></div>
          </section>
        </div>
        <div class="col col-c">
          <section class="panel logpanel">
            <div class="log-head">
              <h2>Log</h2>
              <button type="button" class="btn btn-icon add-entry" id="add-past" aria-label="Add an entry" title="Add an entry"><svg class="ico" width="24" height="24" aria-hidden="true"><use href="#i-plus"/></svg></button>
            </div>
            <div id="log"></div>
          </section>
        </div>
      </div>
    </div>

    <div id="view-trends" hidden>
      <div class="trends-head">
        <div class="seg range" role="group" aria-label="Range">
          <button type="button" class="seg-opt" data-range="7" aria-pressed="true">7 days</button>
          <button type="button" class="seg-opt" data-range="14" aria-pressed="false">14 days</button>
          <button type="button" class="seg-opt" data-range="30" aria-pressed="false">30 days</button>
          <button type="button" class="seg-opt" data-range="all" aria-pressed="false">All</button>
        </div>
        <p class="trends-hint">Tap for info. Pinch or drag to zoom.</p>
      </div>
      <div class="trends-grid">
        <div id="charts"></div>
        <section id="pattern" class="panel"></section>
      </div>
    </div>

    <div id="view-settings" hidden>
      <section class="panel appearance" aria-labelledby="appearance-title">
        <h2 id="appearance-title">Appearance</h2>
        <div class="seg theme-seg" role="group" aria-label="Theme">
          <button type="button" class="seg-opt" data-theme-choice="dark" aria-pressed="false" aria-label="Dark" title="Dark"><svg class="ico" width="24" height="24" aria-hidden="true"><use href="#i-moon"/></svg></button>
          <button type="button" class="seg-opt" data-theme-choice="light" aria-pressed="false" aria-label="Light" title="Light"><svg class="ico" width="24" height="24" aria-hidden="true"><use href="#i-sun"/></svg></button>
          <button type="button" class="seg-opt" data-theme-choice="system" aria-pressed="false" aria-label="Match device" title="Match device"><svg class="ico" width="24" height="24" aria-hidden="true"><use href="#i-monitor"/></svg></button>
        </div>
      </section>
      <section id="reminders-settings" class="panel rem-settings" aria-labelledby="rem-settings-title" hidden></section>
      <div id="settings"></div>
    </div>
  </main>

  <div id="stopwatch" class="stopwatch" hidden></div>
  <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
  <div id="toast" popover="manual" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
