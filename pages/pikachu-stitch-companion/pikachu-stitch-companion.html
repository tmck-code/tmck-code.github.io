<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Glowing Pikachu · Stitch Companion</title>
<style>
  :root{
    --night:#0d0b2c;
    --panel:#171447;
    --panel-2:#1f1b5e;
    --ink:#f4f1ff;
    --ink-dim:#9d97d6;
    --glow:#fde949;
    --glow-soft:#fdf099;
    --done:#62d8b6;
    --line:#2b2775;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    background:var(--night);
    color:var(--ink);
    font-family:ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #app{height:100%;display:flex;flex-direction:column}

  header{
    padding:10px 14px 6px;
    display:flex;align-items:baseline;gap:10px;
    flex:0 0 auto;
  }
  header h1{
    font-size:15px;font-weight:800;letter-spacing:.04em;
  }
  header h1 .spark{color:var(--glow)}
  header .hint{font-size:11px;color:var(--ink-dim);margin-left:auto;text-align:right}

  /* legend */
  #legend{
    flex:0 0 auto;
    display:flex;gap:6px;
    overflow-x:auto;overflow-y:hidden;
    padding:6px 12px 10px;
    scrollbar-width:none;
  }
  #legend::-webkit-scrollbar{display:none}
  #legend{touch-action:pan-x;cursor:grab}
  #legend.dragging{cursor:grabbing}
  #legend.dragging .chip{pointer-events:none}
  .chip{
    flex:0 0 auto;
    display:flex;align-items:center;gap:7px;
    background:var(--panel);
    border:1.5px solid var(--line);
    border-radius:999px;
    padding:6px 12px 6px 7px;
    font-size:12px;font-weight:600;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s, background .15s, opacity .2s, transform .1s;
  }
  .chip:active{transform:scale(.96)}
  .chip .sw{
    width:20px;height:20px;border-radius:50%;
    border:2px solid rgba(255,255,255,.25);
    position:relative;flex:0 0 auto;
  }
  .chip .n{white-space:nowrap}
  .chip .cnt{color:var(--ink-dim);font-weight:500;font-size:11px}
  .chip.sel{border-color:var(--glow);background:var(--panel-2)}
  .chip.faded{opacity:.35}
  .chip.done .sw::after{
    content:'✓';position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:900;color:#08331f;
    background:var(--done);border-radius:50%;
  }
  .chip.done .n{text-decoration:line-through;color:var(--ink-dim)}

  /* canvas stage */
  #stage{
    flex:1 1 auto;position:relative;overflow:hidden;
    touch-action:none;
    background:
      radial-gradient(ellipse at 50% 40%, #191560 0%, var(--night) 70%);
  }
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  #zoomHint{
    position:absolute;top:8px;left:50%;transform:translateX(-50%);
    font-size:11px;color:var(--ink-dim);
    background:rgba(13,11,44,.7);border-radius:999px;padding:4px 12px;
    pointer-events:none;transition:opacity .6s;
  }

  /* complete toggle */
  #completeBox{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    display:none;align-items:center;gap:10px;
    background:var(--panel-2);
    border:1.5px solid var(--glow);
    border-radius:14px;
    padding:10px 16px;
    font-size:13px;font-weight:700;
    cursor:pointer;
    box-shadow:0 4px 24px rgba(0,0,0,.5), 0 0 18px rgba(253,233,73,.12);
  }
  #completeBox.show{display:flex}
  #completeBox input{
    width:20px;height:20px;accent-color:var(--done);cursor:pointer;
  }

  /* footer progress */
  footer{
    flex:0 0 auto;
    padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    background:var(--panel);
    border-top:1px solid var(--line);
  }
  .prog-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
  .prog-row .label{font-size:11px;letter-spacing:.08em;color:var(--ink-dim);font-weight:700;text-transform:uppercase}
  .prog-row .pct{font-size:16px;font-weight:800;color:var(--glow)}
  .prog-row .pct small{font-size:11px;color:var(--ink-dim);font-weight:500;margin-left:6px}
  #bar{
    height:12px;border-radius:999px;background:var(--night);
    border:1px solid var(--line);overflow:hidden;
  }
  #barFill{
    height:100%;width:0%;
    background:linear-gradient(90deg,#62d8b6,#fde949);
    border-radius:999px;
    transition:width .5s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 0 10px rgba(253,233,73,.5);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span class="spark">⚡</span> Glowing Pikachu</h1>
    <div class="hint">tap a colour to isolate it<br>pinch or scroll to zoom</div>
  </header>
  <div id="legend"></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="zoomHint">drag to pan · double-tap to zoom</div>
    <label id="completeBox">
      <input type="checkbox" id="doneCheck">
      <span id="completeLabel"></span>
    </label>
  </div>
  <footer>
    <div class="prog-row">
      <span class="label">Stitched</span>
      <span class="pct"><span id="pctNum">0</span>%<small id="pctDetail">0 / 6,088 stitches</small></span>
    </div>
    <div id="bar"><div id="barFill"></div></div>
  </footer>
</div>

const N = 150;
const TOTAL = COLORS.reduce((s,c)=>s+c[3],0);
const CH = '0123456789ABCDEFGHIJKLMN';
const cells = GRID.map(row => [...row].map(ch => CH.indexOf(ch)));

let selected = null;                 // null = show all; else 1..23
const completed = new Set();         // color indices marked done

/* ---------- legend ---------- */
const legend = document.getElementById('legend');
COLORS.forEach((c,i)=>{
  const idx = i+1;
  const chip = document.createElement('button');
  chip.className = 'chip';
  chip.id = 'chip'+idx;
  chip.innerHTML = `<span class="sw" style="background:${c[2]}"></span>
    <span class="n">${c[0]}</span><span class="cnt">${c[3]}</span>`;
  chip.addEventListener('click', ()=>{
    selected = (selected === idx) ? null : idx;
    refreshUI(); draw();
  });
  legend.appendChild(chip);
});

/* ---------- complete toggle + progress ---------- */
const box = document.getElementById('completeBox');
const check = document.getElementById('doneCheck');
const clabel = document.getElementById('completeLabel');
check.addEventListener('change', ()=>{
  if (selected==null) return;
  check.checked ? completed.add(selected) : completed.delete(selected);
  refreshUI(); draw();
});
function refreshUI(){
  COLORS.forEach((c,i)=>{
    const idx=i+1, chip=document.getElementById('chip'+idx);
    chip.classList.toggle('sel', selected===idx);
    chip.classList.toggle('faded', selected!=null && selected!==idx);
    chip.classList.toggle('done', completed.has(idx));
  });
  if (selected!=null){
    const c = COLORS[selected-1];
    clabel.textContent = `Mark DMC ${c[0]} · ${c[1]} as stitched`;
    check.checked = completed.has(selected);
    box.classList.add('show');
    document.getElementById('chip'+selected)
      .scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  } else box.classList.remove('show');
  const doneCount = [...completed].reduce((s,i)=>s+COLORS[i-1][3],0);
  const pct = Math.round(doneCount/TOTAL*100);
  document.getElementById('pctNum').textContent = pct;
  document.getElementById('pctDetail').textContent =
    doneCount.toLocaleString()+' / '+TOTAL.toLocaleString()+' stitches';
  document.getElementById('barFill').style.width = pct+'%';
}

/* ---------- canvas ---------- */
const stage = document.getElementById('stage');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let scale=1, tx=0, ty=0, base=1;   // view transform (css px)
let dpr=1;

function fit(){
  dpr = window.devicePixelRatio||1;
  const w = stage.clientWidth, h = stage.clientHeight;
  cv.width = w*dpr; cv.height = h*dpr;
  base = Math.min(w,h)*0.96/N;      // css px per cell at scale 1
  clampView(); draw();
}
function clampView(){
  scale = Math.min(Math.max(scale,1),16);
  const w=stage.clientWidth,h=stage.clientHeight,sz=N*base*scale;
  const minX=Math.min((w-sz)/2, w-sz), maxX=Math.max((w-sz)/2,0);
  const minY=Math.min((h-sz)/2, h-sz), maxY=Math.max((h-sz)/2,0);
  tx=Math.min(Math.max(tx,minX),maxX);
  ty=Math.min(Math.max(ty,minY),maxY);
}
function draw(){
  const w=stage.clientWidth,h=stage.clientHeight;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const s=base*scale;
  ctx.translate(tx,ty);
  // fabric backdrop
  ctx.fillStyle='#14113f';
  ctx.fillRect(0,0,N*s,N*s);
  // visible range
  const c0=Math.max(0,Math.floor(-tx/s)), c1=Math.min(N,Math.ceil((w-tx)/s));
  const r0=Math.max(0,Math.floor(-ty/s)), r1=Math.min(N,Math.ceil((h-ty)/s));
  const detail = s>=7;               // draw crosses when zoomed
  for(let r=r0;r<r1;r++){
    const row=cells[r];
    for(let c=c0;c<c1;c++){
      const v=row[c]; if(!v) continue;
      const dim = selected!=null && v!==selected;
      const col = COLORS[v-1][2];
      const x=c*s, y=r*s;
      ctx.globalAlpha = dim?0.10:1;
      if (detail && completed.has(v) && !dim){
        // stitched: render as an X
        ctx.strokeStyle=col;
        ctx.lineWidth=Math.max(1.4,s*0.24);
        ctx.lineCap='round';
        const p=s*0.18;
        ctx.beginPath();
        ctx.moveTo(x+p,y+p);ctx.lineTo(x+s-p,y+s-p);
        ctx.moveTo(x+s-p,y+p);ctx.lineTo(x+p,y+s-p);
        ctx.stroke();
      } else {
        ctx.fillStyle=col;
        ctx.fillRect(x,y,s-(detail?0.6:0),s-(detail?0.6:0));
        if (completed.has(v) && !dim){
          ctx.globalAlpha=0.35;
          ctx.fillStyle='#000';
          ctx.fillRect(x,y,s,s);
        }
      }
    }
  }
  ctx.globalAlpha=1;
  // 10-square guide lines when zoomed
  if (s>=4){
    ctx.strokeStyle='rgba(244,241,255,0.12)';
    ctx.lineWidth=1;
    ctx.beginPath();
    for(let i=0;i<=N;i+=10){
      ctx.moveTo(i*s, r0*s); ctx.lineTo(i*s, r1*s);
      ctx.moveTo(c0*s, i*s); ctx.lineTo(c1*s, i*s);
    }
    ctx.stroke();
  }
  // border
  ctx.strokeStyle='rgba(253,233,73,0.35)';
  ctx.lineWidth=1.5;
  ctx.strokeRect(0,0,N*s,N*s);
}

/* ---------- pan / zoom (pointer events) ---------- */
const pts=new Map();
let lastDist=0,lastMid=null,lastTap=0;
stage.addEventListener('pointerdown',e=>{
  stage.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){
    const [a,b]=[...pts.values()];
    lastDist=Math.hypot(a.x-b.x,a.y-b.y);
    lastMid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  } else if (pts.size===1){
    const now=Date.now();
    if(now-lastTap<300){ zoomAt(e.clientX,e.clientY, scale<4?2:0.25); }
    lastTap=now;
  }
});
stage.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;
  const prev=pts.get(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){
    tx+=e.clientX-prev.x; ty+=e.clientY-prev.y;
    clampView(); draw();
  } else if(pts.size===2){
    const [a,b]=[...pts.values()];
    const dist=Math.hypot(a.x-b.x,a.y-b.y);
    const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    if(lastDist>0){
      const f=dist/lastDist;
      applyZoom(mid.x,mid.y,f);
      tx+=mid.x-lastMid.x; ty+=mid.y-lastMid.y;
      clampView(); draw();
    }
    lastDist=dist; lastMid=mid;
  }
});
function endPt(e){ pts.delete(e.pointerId); lastDist=0; }
stage.addEventListener('pointerup',endPt);
stage.addEventListener('pointercancel',endPt);
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  applyZoom(e.clientX,e.clientY, Math.exp(-e.deltaY*0.0018));
  clampView(); draw();
},{passive:false});
function applyZoom(cx,cy,f){
  const rect=stage.getBoundingClientRect();
  cx-=rect.left; cy-=rect.top;
  const ns=Math.min(Math.max(scale*f,1),16);
  const real=ns/scale;
  tx=cx-(cx-tx)*real; ty=cy-(cy-ty)*real;
  scale=ns;
}
function zoomAt(cx,cy,f){ applyZoom(cx,cy,f); clampView(); draw(); }

stage.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
window.addEventListener('resize',fit);

/* legend drag-to-scroll (mouse) */
let lgDown=false,lgX=0,lgScroll=0,lgMoved=false;
legend.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse')return;
  lgDown=true;lgMoved=false;lgX=e.clientX;lgScroll=legend.scrollLeft;
});
legend.addEventListener('pointermove',e=>{
  if(!lgDown)return;
  const dx=e.clientX-lgX;
  if(Math.abs(dx)>4){lgMoved=true;legend.classList.add('dragging');}
  legend.scrollLeft=lgScroll-dx;
});
['pointerup','pointerleave'].forEach(ev=>legend.addEventListener(ev,()=>{
  lgDown=false;
  setTimeout(()=>legend.classList.remove('dragging'),0);
}));

setTimeout(()=>{document.getElementById('zoomHint').style.opacity=0},3500);
fit(); refreshUI();
// center at start
tx=(stage.clientWidth-N*base)/2; ty=(stage.clientHeight-N*base)/2; draw();
</script>
</body>
</html>
