<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Glowing Pikachu · Stitch Companion</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23fde949' d='M13 2 4 14h6l-1 8 9-12h-6z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="pikachu-stitch-companion.css">
</head>
<body>
<div id="app">
  <header>
    <h1><span class="spark">⚡</span> Glowing Pikachu</h1>
    <div class="hint">tap a colour to isolate it<br>pinch or scroll to zoom</div>
  </header>
  <div id="legend"></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="zoomHint">drag to pan · double-tap to zoom · hold a column to pin it for flipping</div>
    <canvas id="miniMap" width="150" height="150"></canvas>
    <div id="blockCelebrate"></div>
  </div>
  <div id="routePanel">
    <span id="routeStatus">select a colour to plan a route</span>
    <span id="posReadout" title="Cell position"></span>
    <span id="colourReadout" class="tbtn-readout" title="Selected colour progress" hidden></span>
    <button id="routeDetailsBtn" class="tbtn" type="button" disabled aria-label="Route details" title="Route details" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
      <span class="lbl">Details</span>
    </button>
  </div>
  <div id="routeDetails">
    <div class="rd-section">
      <h3>Carry audit</h3>
      <ul id="carryAudit"></ul>
    </div>
    <div class="rd-section">
      <h3>Cluster anchors</h3>
      <ul id="anchorList"></ul>
    </div>
  </div>
  <div id="toolbar">
    <button id="markToggle" class="tbtn" type="button" disabled aria-label="Mark stitches" title="Mark stitches" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
      <span class="lbl">Mark</span>
    </button>
    <button id="undoBtn" class="tbtn" type="button" disabled aria-label="Undo" title="Undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>
      <span class="lbl">Undo</span>
    </button>
    <button id="markAllBtn" class="tbtn" type="button" disabled aria-label="Mark all of this colour as stitched" title="Mark all of this colour as stitched" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><polyline points="7,12.5 10.5,16 17,8.5"/></svg>
      <span class="lbl">Mark all</span>
    </button>
    <button id="markBlockBtn" class="tbtn" type="button" aria-label="Mark this block as stitched" title="Mark this block as stitched">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/><polyline points="8,12.5 10.5,15 16.5,9" stroke="#fde949" stroke-width="3"/></svg>
      <span class="lbl">Mark block</span>
    </button>
    <button id="upToHereBtn" class="tbtn" type="button" disabled aria-label="Stitched up to here: tap a cell" title="Stitched up to here: tap a cell" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h5l2-5 3 10 2-5h6"/><circle cx="21" cy="12" r="2" fill="currentColor"/></svg>
      <span class="lbl">Up to here</span>
    </button>
    <button id="setStartBtn" class="tbtn" type="button" disabled aria-label="Set start point" title="Set start point" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><line x1="12" y1="1" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="1" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="23" y2="12"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
      <span class="lbl">Set start</span>
    </button>
    <button id="prevBlock" class="tbtn" type="button" disabled aria-label="Previous block" title="Previous block">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><polyline points="13.5,8 9.5,12 13.5,16"/></svg>
    </button>
    <span id="blockLabel" class="tbtn-readout" title="Current block">&nbsp;</span>
    <button id="nextBlock" class="tbtn" type="button" disabled aria-label="Next block" title="Next block">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><polyline points="10.5,8 14.5,12 10.5,16"/></svg>
    </button>
    <button id="blockSizeBtn" class="tbtn tbtn-text" type="button" aria-label="Block size (tap to cycle)" title="Block size (tap to cycle)">10×10</button>
    <button id="flipBtn" class="tbtn" type="button" aria-label="Flip to back view" title="Flip to back view" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="2" x2="12" y2="22" stroke-dasharray="2 3"/><path d="M9 6 3 12l6 6"/><path d="m15 6 6 6-6 6"/></svg>
      <span class="lbl" id="viewLabel">Front</span>
    </button>
    <button id="symbolsBtn" class="tbtn" type="button" aria-label="Toggle symbols" title="Toggle symbols" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="9" y1="3" x2="7" y2="21"/><line x1="17" y1="3" x2="15" y2="21"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>
      <span class="lbl">Symbols</span>
    </button>
    <button id="heatmapBtn" class="tbtn" type="button" aria-label="Toggle confetti heatmap" title="Toggle confetti heatmap" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c1 3.5-1.5 5-1.5 7.5A3.5 3.5 0 0 0 14 13c2.5 0 3.5-2 3-4 2.5 2 4 5 4 7.5A7.5 7.5 0 0 1 6 20a7.6 7.6 0 0 1-3-6c0-5 5-7 9-12Z"/></svg>
      <span class="lbl">Heatmap</span>
    </button>
    <button id="statsBtn" class="tbtn" type="button" aria-label="Stats" title="Stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="20" x2="6" y2="12"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="9"/></svg>
      <span class="lbl">Stats</span>
    </button>
    <button id="settingsBtn" class="tbtn" type="button" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      <span class="lbl">Settings</span>
    </button>
  </div>
  <footer>
    <div class="prog-row">
      <span class="label">Stitched</span>
      <span class="pct"><span id="pctNum">0</span>%<small id="pctDetail">0 / 6,088 stitches</small></span>
    </div>
    <div id="bar"><div id="barFill"></div></div>
  </footer>
</div>

<div id="settingsSheet" class="sheet-backdrop">
  <div class="sheet">
    <div class="sheet-head"><h2>Settings</h2><button id="closeSettingsBtn" class="tbtn" type="button" aria-label="Close" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button></div>
    <div class="sheet-body">
      <label class="set-row">Fabric count (ct) <input id="setFabricCount" type="number" min="1" max="32" step="1"></label>
      <label class="set-row">Strands <input id="setStrands" type="number" min="1" max="6" step="1"></label>
      <label class="set-row">Max carry (stitches) <input id="setMaxCarry" type="number" min="1" max="20" step="1"></label>
      <label class="set-row">Thread length (in) <input id="setThreadLength" type="number" min="6" max="36" step="1"></label>
      <label class="set-row set-check"><input id="setRailroading" type="checkbox"> Railroading</label>
      <label class="set-row set-check"><input id="setDarkCarryGuard" type="checkbox"> Dark-carry guard</label>
      <label class="set-row set-check"><input id="setConfettiFirst" type="checkbox"> Confetti clusters first</label>
      <label class="set-row">Top leg direction
        <select id="setTopLegDirection"><option value="/">/</option><option value="\">\</option></select>
      </label>
      <label class="set-row">Block order
        <select id="setBlockOrder"><option value="serpentine">serpentine</option><option value="row-major">row-major</option></select>
      </label>
      <label class="set-row">Block size
        <select id="setBlockSize"><option value="10">10 × 10</option><option value="15">15 × 15</option><option value="25">25 × 25</option><option value="30">30 × 30</option><option value="50">50 × 50</option></select>
      </label>
      <label class="set-row">Start origin
        <select id="setOrigin"><option value="centre">centre</option><option value="page">page (top-left)</option></select>
      </label>
      <button id="conservativeCarryBtn" class="tbtn" type="button">Conservative carry (max 3)</button>
      <button id="resetBtn" class="tbtn" type="button">Reset progress</button>
    </div>
  </div>
</div>

<div id="statsSheet" class="sheet-backdrop">
  <div class="sheet">
    <div class="sheet-head"><h2>Stats</h2><button id="closeStatsBtn" class="tbtn" type="button" aria-label="Close" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button></div>
    <div class="sheet-body" id="statsBody"></div>
  </div>
</div>

  "./js/ui.js":"./js/ui.js?v=20260822154800",
  "./js/blocks.js":"./js/blocks.js?v=20260822154800",
  "./js/state.js":"./js/state.js?v=20260822154800",
  "./js/planner.js":"./js/planner.js?v=20260822154800",
  "./js/persistence.js":"./js/persistence.js?v=20260822154800",
  "./js/pattern.js":"./js/pattern.js?v=20260822154800",

}}
</script>
<script type="module" src="js/main.js?v=20260822154800"></script>
</body>
</html>
