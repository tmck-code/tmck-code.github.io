<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Glowing Pikachu · Stitch Companion</title>
<link rel="stylesheet" href="pikachu-stitch-companion.css">
</head>
<body>
<div id="app">
  <header>
    <h1><span class="spark">⚡</span> Glowing Pikachu</h1>
    <div class="hint">tap a colour to isolate it<br>pinch or scroll to zoom</div>
  </header>
  <div id="legend"></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="zoomHint">drag to pan · double-tap to zoom</div>
    <label id="completeBox">
      <input type="checkbox" id="doneCheck">
      <span id="completeLabel"></span>
    </label>
    <canvas id="miniMap" width="150" height="150"></canvas>
    <div id="blockCelebrate"></div>
  </div>
  <div id="routePanel">
    <span id="routeStatus">—</span>
    <button id="routeDetailsBtn" class="tbtn" type="button" disabled>Details</button>
  </div>
  <div id="routeDetails">
    <div class="rd-section">
      <h3>Carry audit</h3>
      <ul id="carryAudit"></ul>
    </div>
    <div class="rd-section">
      <h3>Cluster anchors</h3>
      <ul id="anchorList"></ul>
    </div>
  </div>
  <div id="toolbar">
    <button id="markToggle" class="tbtn" type="button" disabled>Mark</button>
    <button id="undoBtn" class="tbtn" type="button" disabled>Undo</button>
    <button id="setStartBtn" class="tbtn" type="button" disabled>Set start</button>
    <button id="prevBlock" class="tbtn" type="button" disabled>◀ Block</button>
    <button id="nextBlock" class="tbtn" type="button" disabled>Block ▶</button>
    <button id="flipBtn" class="tbtn" type="button">Front <span id="viewLabel">(tap to flip)</span></button>
    <button id="symbolsBtn" class="tbtn" type="button">Symbols</button>
    <button id="heatmapBtn" class="tbtn" type="button">Heatmap</button>
    <button id="statsBtn" class="tbtn" type="button">Stats</button>
    <button id="settingsBtn" class="tbtn" type="button">⚙ Settings</button>
    <span id="colourReadout" class="tbtn-readout">—</span>
  </div>
  <footer>
    <div class="prog-row">
      <span class="label">Stitched</span>
      <span class="pct"><span id="pctNum">0</span>%<small id="pctDetail">0 / 6,088 stitches</small></span>
    </div>
    <div id="bar"><div id="barFill"></div></div>
  </footer>
</div>

<div id="settingsSheet" class="sheet-backdrop">
  <div class="sheet">
    <div class="sheet-head"><h2>Settings</h2><button id="closeSettingsBtn" class="tbtn" type="button">Close</button></div>
    <div class="sheet-body">
      <label class="set-row">Fabric count (ct) <input id="setFabricCount" type="number" min="1" max="32" step="1"></label>
      <label class="set-row">Strands <input id="setStrands" type="number" min="1" max="6" step="1"></label>
      <label class="set-row">Max carry (stitches) <input id="setMaxCarry" type="number" min="1" max="20" step="1"></label>
      <label class="set-row">Thread length (in) <input id="setThreadLength" type="number" min="6" max="36" step="1"></label>
      <label class="set-row set-check"><input id="setRailroading" type="checkbox"> Railroading</label>
      <label class="set-row set-check"><input id="setDarkCarryGuard" type="checkbox"> Dark-carry guard</label>
      <label class="set-row set-check"><input id="setConfettiFirst" type="checkbox"> Confetti clusters first</label>
      <label class="set-row">Top leg direction
        <select id="setTopLegDirection"><option value="/">/</option><option value="\">\</option></select>
      </label>
      <label class="set-row">Block order
        <select id="setBlockOrder"><option value="serpentine">serpentine</option><option value="row-major">row-major</option></select>
      </label>
      <label class="set-row">Start origin
        <select id="setOrigin"><option value="centre">centre</option><option value="page">page (top-left)</option></select>
      </label>
      <button id="conservativeCarryBtn" class="tbtn" type="button">Conservative carry (max 3)</button>
      <button id="resetBtn" class="tbtn" type="button">Reset progress</button>
    </div>
  </div>
</div>

<div id="statsSheet" class="sheet-backdrop">
  <div class="sheet">
    <div class="sheet-head"><h2>Stats</h2><button id="closeStatsBtn" class="tbtn" type="button">Close</button></div>
    <div class="sheet-body" id="statsBody"></div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
