<!-- @dsCard group="Brand" viewport="700x170" name="ANSI palette" subtitle="The eight terminal colours, mapped to the brand." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-canvas);font:var(--type-body-sm)}.n{font:var(--type-eyebrow);color:var(--text-muted);margin-top:5px;display:block;line-height:1.6}</style></head><body><div style="display:flex;gap:6px;margin-bottom:10px"><div style="flex:1"><div style="height:44px;background:var(--night-900);border-radius:var(--radius-xs)"></div><span class="n">black</span></div><div style="flex:1"><div style="height:44px;background:var(--red-500);border-radius:var(--radius-xs)"></div><span class="n">red</span></div><div style="flex:1"><div style="height:44px;background:var(--moss-500);border-radius:var(--radius-xs)"></div><span class="n">green</span></div><div style="flex:1"><div style="height:44px;background:var(--amber-300);border-radius:var(--radius-xs)"></div><span class="n">yellow</span></div><div style="flex:1"><div style="height:44px;background:var(--steel-500);border-radius:var(--radius-xs)"></div><span class="n">blue</span></div><div style="flex:1"><div style="height:44px;background:var(--ink-500);border-radius:var(--radius-xs)"></div><span class="n">magenta</span></div><div style="flex:1"><div style="height:44px;background:var(--moss-300);border-radius:var(--radius-xs)"></div><span class="n">cyan</span></div><div style="flex:1"><div style="height:44px;background:var(--steel-200);border-radius:var(--radius-xs)"></div><span class="n">white</span></div></div><div style="font:var(--type-code);color:var(--steel-300)">░▒▓█ <span style="color:var(--moss-500)">██</span><span style="color:var(--amber-300)">██</span><span style="color:var(--red-500)">██</span><span style="color:var(--steel-500)">██</span> █▓▒░ <span style="color:var(--text-muted)">— the brand blue is a steel grey; there is no true blue in this palette.</span></div></body></html>
