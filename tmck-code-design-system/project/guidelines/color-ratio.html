<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-canvas);font:var(--type-body-sm)}.g{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:6px;height:74px}.n{font:var(--type-eyebrow);color:var(--text-muted);margin-top:5px;display:block;line-height:1.5}.hx{font:var(--type-code);font-size:10px}</style></head><body><div style="display:flex;height:56px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-subtle)"><div style="flex:58;background:var(--night-900)"></div><div style="flex:22;background:var(--night-700)"></div><div style="flex:12;background:var(--moss-500)"></div><div style="flex:5;background:var(--steel-300)"></div><div style="flex:3;background:var(--amber-500)"></div></div><p style="font:var(--type-body-sm);color:var(--text-muted);margin:10px 0 0">Roughly 80% night surfaces, 12% moss, 5% steel, <span style="color:var(--accent)">3% amber</span>. The mark works the same way — mostly plating, one small glow. Orange never becomes a background.</p></body></html>
