<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-canvas);font:var(--type-body-sm)}.g{display:flex;gap:8px;flex-wrap:wrap}.n{font:var(--type-eyebrow);color:var(--text-muted);margin-top:5px;display:block;line-height:1.5}</style></head><body><div style="display:flex;gap:20px;align-items:center;padding:8px"><div style="flex:1"><div style="height:56px;background:var(--bg-raised);border-radius:var(--radius-sm);box-shadow:var(--glow-accent);display:flex;align-items:center;justify-content:center;font:var(--type-eyebrow);color:var(--accent)">focused / primary</div><span class="n">glow-accent</span></div><div style="flex:1"><div style="height:56px;background:var(--bg-raised);border-radius:var(--radius-sm);box-shadow:var(--glow-danger);display:flex;align-items:center;justify-content:center;font:var(--type-eyebrow);color:var(--danger)">error / destructive</div><span class="n">glow-danger</span></div><div style="flex:1"><div style="height:56px;background:var(--bg-raised);border-radius:var(--radius-sm);box-shadow:var(--ring-focus);display:flex;align-items:center;justify-content:center;font:var(--type-eyebrow);color:var(--text-secondary)">focus ring</div><span class="n">ring-focus</span></div></div></body></html>
